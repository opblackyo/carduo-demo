<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>駕值連城 CarDuo｜三種選車體驗</title>
    <link rel="stylesheet" crossorigin href="./assets/home-isKDFEY-.css">
  </head>
  <body>
    <main>
      <div class="brand">CarDuo <span>駕值連城</span></div>
      <div class="intro">
        <h1>找到下一台車，<br />從你喜歡的方式開始。</h1>
        <p>
          看見喜歡的風景、比較在意的條件，或先聊聊你的日常。三種不同的選車體驗，都能走到適合你的下一步。
        </p>
      </div>
      <nav aria-label="選擇原型">
        <a class="atelier" href="./apps/ateliers/">
          <img src="./images/hero-porsche.jpg" alt="Porsche 行駛情境照片" />
          <div>
            <span class="category">隨靈感探索</span><strong>展廳敘事</strong>
            <p>從車款故事與生活主題，慢慢認識你的下一台車。</p>
            <span class="open">進入展廳 <b aria-hidden="true">↗</b></span>
          </div>
        </a>
        <a class="market" href="./apps/market/">
          <img src="./images/car-black.jpg" alt="BMW 行駛情境照片" />
          <div>
            <span class="category">把條件放在一起</span
            ><strong>交易工作台</strong>
            <p>依預算、年份與里程篩選，並排比較再做決定。</p>
            <span class="open">開始找車 <b aria-hidden="true">↗</b></span>
          </div>
        </a>
        <a class="match" href="./apps/match/">
          <img src="./images/car-road.jpg" alt="車輛行經山路的情境照片" />
          <div>
            <span class="category">從生活找到方向</span
            ><strong>引導配對</strong>
            <p>回答四個小問題，看看哪些車款適合你的日常。</p>
            <span class="open">幫我選車 <b aria-hidden="true">↗</b></span>
          </div>
        </a>
      </nav>
      <footer>
        <span>互動原型 · 三版共用本機示範資料</span
        ><span>身分、預約與付款均為模擬。</span>
      </footer>
    </main>
  </body>
</html>
